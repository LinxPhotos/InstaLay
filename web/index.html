<!DOCTYPE html>
<html lang="en" data-linx-api-base="https://linx.photos">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="InstaLay — batch canvas and tapestry layouts for Instagram.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="InstaLay">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>InstaLay</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    body {
      margin: 0;
      background: #0f1115;
      color: #e8eaed;
    }
    #linx-auth-panel {
      max-width: 28rem;
      margin: 0 auto;
      padding: 1rem 1.25rem 0.5rem;
    }
    #linx-auth-panel h1 {
      font-size: 1.125rem;
      font-weight: 600;
      margin: 0 0 0.35rem;
    }
    #linx-auth-panel p {
      margin: 0 0 0.75rem;
      font-size: 0.875rem;
      opacity: 0.85;
      line-height: 1.4;
    }
    #linx-auth-form {
      display: grid;
      gap: 0.5rem;
    }
    #linx-auth-form label {
      font-size: 0.75rem;
      opacity: 0.8;
    }
    #linx-auth-form input {
      width: 100%;
      box-sizing: border-box;
      padding: 0.5rem 0.65rem;
      border-radius: 0.375rem;
      border: 1px solid #3c4048;
      background: #1a1d24;
      color: inherit;
    }
    #linx-auth-form button {
      margin-top: 0.25rem;
      padding: 0.55rem 0.75rem;
      border: 0;
      border-radius: 0.375rem;
      background: #3b82f6;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    #linx-auth-form a {
      font-size: 0.8125rem;
      color: #93c5fd;
      text-decoration: none;
    }
    html.linx-connected #linx-auth-panel {
      display: none;
    }
  </style>
</head>
<body>
  <section id="linx-auth-panel" aria-label="Linx Photos sign-in">
    <h1>Connect Linx Photos</h1>
    <p>
      Pair InstaLay with your Linx account (same desktop-connect flow as Capture One),
      then paste the access token below. Your password manager can save these fields.
    </p>
    <form id="linx-auth-form" method="post" autocomplete="on">
      <label for="linx-api-base">Linx API base</label>
      <input
        id="linx-api-base"
        name="username"
        type="text"
        autocomplete="username"
        value="https://linx.photos"
        required
      />
      <label for="linx-access-token">Access token</label>
      <input
        id="linx-access-token"
        name="password"
        type="password"
        autocomplete="current-password"
        required
      />
      <button type="submit">Connect</button>
      <a id="linx-open-connect" href="#">Open desktop-connect in a new tab</a>
    </form>
  </section>
  <script src="linx_auth_bootstrap.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
